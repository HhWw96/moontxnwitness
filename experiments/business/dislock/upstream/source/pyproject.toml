[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dislock"
version = "0.1.0"
description = "PostgreSQL-backed distributed locks for cron jobs and commands."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "croniter>=2.0.5",
    "psycopg[binary]>=3.1",
]
keywords = ["cron", "distributed-lock", "postgres", "scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Actticus/dislock"
Repository = "https://github.com/Actticus/dislock"

[project.scripts]
dislock = "dislock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dislock"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.0.0",
    "ruff>=0.15.22",
    "types-croniter>=2.0.5",
]

[tool.pytest.ini_options]
addopts = [
    "-m",
    "not integration",
]
markers = [
    "integration: tests that require a real PostgreSQL instance",
]
