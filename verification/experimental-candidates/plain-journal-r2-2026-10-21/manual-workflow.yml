name: Manual bounded plain journal experiment
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed immutable 40-character commit with the frozen public bundle
        required: true
        type: string
permissions:
  contents: read
jobs:
  plain-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: mtw
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: mtw_plain_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U mtw -d mtw_plain_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MTW_REQUESTED_REF: ${{ inputs.source_ref }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ''
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Require an immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MTW_REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.5'
      - name: Create fresh context and bind checked-out source
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/plain-journal-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$context"
          export MTW_PLAIN_CONTEXT="$context"
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['MTW_PLAIN_CONTEXT'])
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source==os.environ['MTW_REQUESTED_REF']
          value={'sourceCommit':source,'workflowCommit':os.environ['GITHUB_SHA'],'requestedRef':os.environ['MTW_REQUESTED_REF'],'actualDatabaseTestsExecuted':False,'formalPerformanceMeasurement':False,'image':'postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c'}
          with (root/'source-context.json').open('x',encoding='utf-8') as file:json.dump(value,file,indent=2);file.write('\n')
          PY
      - name: Verify exact frozen bundle before installing its declared driver
        shell: bash
        run: |
          set -euo pipefail
          python -B verification/experimental-candidates/plain-journal-r2-2026-10-21/restore_and_run.py verify > "$RUNNER_TEMP/plain-journal-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bundle-verify.log" 2>&1
      - name: Install only frozen hash-verified fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r verification/experimental-candidates/plain-journal-r2-2026-10-21/bundle/repository/examples/postgres-requirements.txt > "$RUNNER_TEMP/plain-journal-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/driver-install.log" 2>&1
      - name: Restore fresh source layout, run 31 FS/mock cases then seven actual PG scenarios
        shell: bash
        run: |
          set -euo pipefail
          python -B verification/experimental-candidates/plain-journal-r2-2026-10-21/restore_and_run.py run --work "$RUNNER_TEMP/plain-journal-work-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --fixture-port '${{ job.services.postgres.ports[5432] }}' > "$RUNNER_TEMP/plain-journal-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/runner.log" 2>&1
      - name: Preserve actual server logs and image identity
        if: always()
        shell: bash
        env:
          MTW_PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/plain-journal-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$context"
          docker logs "$MTW_PG_SERVICE_ID" > "$context/postgres-server.log" 2>&1
          docker inspect --format '{{.Image}}' "$MTW_PG_SERVICE_ID" > "$context/postgres-image-id.txt" 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: plain-journal-r2-raw-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/plain-journal-context-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/plain-journal-work-${{ github.run_id }}-${{ github.run_attempt }}/
