name: Independently verify storage cleanup faults
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-sync-r3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Execute independent original expectation without changing candidate
        run: python -B scripts/experimental_storage_independent_ci.py --candidate r3 --work "${{ runner.temp }}/mtw-storage-independent-r3"
      - name: Preserve actual original journal, crash intent and failure observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-storage-r3-${{ matrix.os }}
          path: ${{ runner.temp }}/mtw-storage-independent-r3/evidence/
          if-no-files-found: error
          compression-level: 6
