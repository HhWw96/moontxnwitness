name: Verify frozen experimental storage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-r4:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Execute frozen candidate in a new isolated directory
        run: python -B scripts/experimental_storage_ci.py --candidate r4 --work "${{ runner.temp }}/mtw-storage-r4"
      - name: Preserve actual receipts, inputs and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-storage-r4-${{ matrix.os }}
          path: ${{ runner.temp }}/mtw-storage-r4/evidence/
          if-no-files-found: error
          compression-level: 6
