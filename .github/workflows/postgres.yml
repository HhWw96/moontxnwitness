name: Verify actual PostgreSQL 18
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional immutable release tag to verify with this workflow
        required: false
        default: ''
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: mtw
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: mtw_test
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U mtw -d mtw_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MTW_INPUT_CACHE: ${{ github.workspace }}/artifacts/input-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test configured owned-controller startup and retained diagnostics
        run: python -B -m unittest discover -s scripts -p test_configured_session_ci.py -v
      - name: Install pinned MoonBit
        run: |
          set -euo pipefail
          python -B scripts/install_moonbit.py --home "$RUNNER_TEMP/moonbit" --github-env
      - name: Restore checksum-pinned public test inputs
        run: python scripts/input_cache.py prepare --scope tests
      - name: Build offline analyzer
        run: npm run build
      - name: Record database input bindings before execution
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {verificationFingerprint} from './scripts/verification-fingerprint.mjs';
          const runId=process.env.GITHUB_RUN_ID,attempt=process.env.GITHUB_RUN_ATTEMPT;
          if(!/^[1-9][0-9]*$/.test(runId??'')||!/^[1-9][0-9]*$/.test(attempt??''))throw new Error('Missing or invalid GitHub run identity');
          const directory=`verification/postgres-ci-runtime/${runId}-${attempt}`;
          mkdirSync(directory,{recursive:true});
          const record={phase:'before',sourceCommit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),buildManifest:JSON.parse(readFileSync('dist/build-manifest.json')),testedFileSha256:verificationFingerprint(process.cwd())};
          writeFileSync(`${directory}/postgres-ci-runtime-before.json`,JSON.stringify(record,null,2)+'\n',{flag:'wx'});
          JS
      - name: Install frozen database driver and ORM
        run: python -m pip install --require-hashes -r examples/orm-requirements.txt
      - name: Install checksum-pinned configured SQL adapter
        run: python -m pip install --require-hashes -r integrations/python/requirements-configured-sql.txt
      - name: Check out the fixed FastAPI Users SQLAlchemy adapter
        if: ${{ !inputs.source_ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fastapi-users/fastapi-users-db-sqlalchemy
          ref: 6397ace506d829a2ee12786da5d724c3f4c6b634
          path: artifacts/fastapi-users-upstream
          persist-credentials: false
      - name: Install FastAPI Users for the fixed base-user comparison
        if: ${{ !inputs.source_ref }}
        run: python -m pip install 'fastapi-users==14.0.2'
      - name: Verify configured same-connection initial diagnostics on three tables
        env:
          MTW_CONFIGURED_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B scripts/configured-session-ci-postgres.py --execute --owned-database --dsn-env MTW_CONFIGURED_PG_DSN --output verification/configured-session-v4/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify PostgreSQL point windows and replay the model reports
        env:
          MTW_CONFIGURED_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: python -B scripts/configured-point-postgres.py --owned-database --dsn-env MTW_CONFIGURED_PG_DSN --output verification/configured-point-v4/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Capture configured full-row CRUD and verify source-bound windows
        env:
          MTW_CONFIGURED_V2_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          configured_extra=()
          if [ -d artifacts/fastapi-users-upstream ]; then
            configured_extra+=(--fastapi-users-checkout artifacts/fastapi-users-upstream --fastapi-users-seed-campaign --with-paged)
          fi
          python -B scripts/configured-source-v2-postgres.py --dsn-env MTW_CONFIGURED_V2_DSN --owned-database --with-window --with-analysis --with-reduction --with-async --with-sqlalchemy "${configured_extra[@]}" --output verification/configured-window-v2/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
          node scripts/configured-window-v2-check.mjs --core dist/sql-projection-v2-core.mjs --receipt verification/configured-window-v2/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json --output verification/configured-window-v2/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}/analysis-checks.json
          node scripts/configured-window-reduction-v2-check.mjs --core dist/sql-projection-v2-core.mjs --receipt verification/configured-window-v2/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json --output verification/configured-window-v2/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}/reduction/checks.json
          node scripts/configured-window-structured-test.mjs --runtime dist --receipt verification/configured-window-v2/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json --output verification/configured-window-v2/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}/structured-checks.json
          node scripts/configured-window-v2-capsule-test.mjs --runtime dist --receipt verification/configured-window-v2/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json --output verification/configured-window-v2/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}/capsule-checks.json
          node examples/point-window-replay.mjs
      - name: Stage the gate inputs from the original ORM run
        if: ${{ !inputs.source_ref }}
        env:
          RECEIPT: verification/configured-window-v2/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
        run: node scripts/stage-orm-point-window-gates.mjs --runtime dist --receipt "$RECEIPT" --output "$RUNNER_TEMP/mtw-orm-action"
      - name: Require the ordered ORM capture to pass with the public verifier
        if: ${{ !inputs.source_ref }}
        id: ordered_orm
        uses: ./.github/actions/check-point-window
        with:
          release-version: '0.6.4'
          portable-sha256: 53483a92b1449667914456a7999ce28ad3406e1389467b86661d736e7e7bfdfc
          capsule: ${{ runner.temp }}/mtw-orm-action/ordered.capsule.json
          config: ${{ runner.temp }}/mtw-orm-action/config.json
          policy: ${{ runner.temp }}/mtw-orm-action/policy.json
      - name: Exercise the capture with the duplicate email rollback
        if: ${{ !inputs.source_ref }}
        id: duplicate_orm
        continue-on-error: true
        uses: ./.github/actions/check-point-window
        with:
          release-version: '0.6.4'
          portable-sha256: 53483a92b1449667914456a7999ce28ad3406e1389467b86661d736e7e7bfdfc
          capsule: ${{ runner.temp }}/mtw-orm-action/duplicate.capsule.json
          config: ${{ runner.temp }}/mtw-orm-action/config.json
          policy: ${{ runner.temp }}/mtw-orm-action/policy.json
      - name: Require the incomplete ORM window to block the job
        if: ${{ !inputs.source_ref }}
        env:
          ORDERED: ${{ steps.ordered_orm.outputs.verdict }}
          DUPLICATE: ${{ steps.duplicate_orm.outputs.verdict }}
          DUPLICATE_EXIT: ${{ steps.duplicate_orm.outputs.exit-code }}
          DUPLICATE_OUTCOME: ${{ steps.duplicate_orm.outcome }}
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'mtw-orm-action'
          ordered, duplicate = (json.loads(os.environ[key]) for key in ('ORDERED', 'DUPLICATE'))
          assert ordered['accepted'] is True and ordered['sourceCoverageComplete'] is True
          assert os.environ['DUPLICATE_OUTCOME'] == 'failure' and os.environ['DUPLICATE_EXIT'] == '2'
          assert duplicate['accepted'] is False and duplicate['status'] == 'unknown'
          assert duplicate['reportMatches'] is True and duplicate['sourceCoverageComplete'] is False
          (root / 'gate.json').write_text(json.dumps({'passed': True, 'ordered': ordered, 'duplicate': duplicate}, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.source_ref }}
        with:
          name: fastapi-users-point-window-gates
          path: |
            ${{ runner.temp }}/mtw-orm-action/staged.json
            ${{ runner.temp }}/mtw-orm-action/gate.json
      - name: Re-run capture, reduction and replay in five PostgreSQL rounds
        if: ${{ !inputs.source_ref }}
        env:
          MTW_CONFIGURED_V2_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: >-
          node scripts/postgres-point-window-demo.mjs --runtime dist
          --dsn-env MTW_CONFIGURED_V2_DSN --output "$RUNNER_TEMP/mtw-live-point"
      - name: Exercise the refutation gate with the newly captured write skew
        if: ${{ !inputs.source_ref }}
        id: live_skew
        continue-on-error: true
        uses: ./.github/actions/check-point-window
        with:
          release-version: '0.6.4'
          portable-sha256: 53483a92b1449667914456a7999ce28ad3406e1389467b86661d736e7e7bfdfc
          capsule: ${{ runner.temp }}/mtw-live-point/round-1/fixtures/before.capsule.json
          config: ${{ runner.temp }}/mtw-live-point/round-1/fixtures/config.json
          policy: ${{ runner.temp }}/mtw-live-point/round-1/fixtures/policy.json
      - name: Require the new counterexample to block the job
        if: ${{ !inputs.source_ref }}
        env:
          VERDICT: ${{ steps.live_skew.outputs.verdict }}
          EXIT_CODE: ${{ steps.live_skew.outputs.exit-code }}
          OUTCOME: ${{ steps.live_skew.outcome }}
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'mtw-live-point'
          receipt = json.loads((root / 'receipt.json').read_bytes())
          assert receipt['passed'] is True and len(receipt['rounds']) == 5
          assert os.environ['OUTCOME'] == 'failure' and os.environ['EXIT_CODE'] == '1'
          verdict = json.loads(os.environ['VERDICT'])
          assert verdict['verifiedRefutation'] is True and verdict['sourceCoverageComplete'] is True
          (root / 'gate.json').write_text(json.dumps(verdict, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.source_ref && always() }}
        with:
          name: replayed-postgresql-point-windows
          path: |
            ${{ runner.temp }}/mtw-live-point/receipt.json
            ${{ runner.temp }}/mtw-live-point/gate.json
            ${{ runner.temp }}/mtw-live-point/round-*/replay.json
      - name: Capture all ten configured model scenarios and verify the current build
        shell: bash
        env:
          MTW_MODEL_CI_ROOT: verification/model-profile-v3/postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MTW_MODEL_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          MTW_MODEL_CONNECTION: ${{ runner.temp }}/moontxnwitness-model-profile-${{ github.run_id }}-${{ github.run_attempt }}.json
          MTW_PYTHON: python
        run: |
          set -euo pipefail
          umask 077
          python -I -B - <<'PY'
          import json, os, pathlib
          connection = pathlib.Path(os.environ['MTW_MODEL_CONNECTION'])
          assert connection.parent.resolve() == pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          with connection.open('x', encoding='utf-8') as stream:
              json.dump({'host':'127.0.0.1', 'port':int(os.environ['MTW_MODEL_PG_PORT']),
                         'dbname':'mtw_test', 'user':'mtw', 'password':'fixture-only'}, stream)
          PY
          trap 'rm -f -- "$MTW_MODEL_CONNECTION"' EXIT
          python -B experiments/model_profile_v3/driver_cases.py \
            --connection-file "$MTW_MODEL_CONNECTION" \
            --output "$MTW_MODEL_CI_ROOT/suite"
          node experiments/model_profile_v3/verify_cases.mjs \
            "$MTW_MODEL_CI_ROOT/suite" \
            "$MTW_MODEL_CI_ROOT/projection"
      - name: Capture and reproduce 20 rounds per isolation scenario
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: npm run postgres:verify
      - name: Record the actual checked-out source commit
        # New source refs include a conservative driver capture adapter.
        if: always()
        env:
          MTW_WORKFLOW_SHA: ${{ github.sha }}
          MTW_REQUESTED_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          pathlib.Path('verification/postgres-ci-source.json').write_text(json.dumps({'sourceCommit':source,'workflowCommit':os.environ['MTW_WORKFLOW_SHA'],'requestedRef':os.environ['MTW_REQUESTED_REF']}, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Verify automatic capture against actual PostgreSQL
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          if [ -f scripts/capture-postgres-e2e.mjs ]; then
            npm run capture:verify
          fi
      - name: Verify experimental provenance on ordinary tables
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          if [ -f experiments/provenance/postgres_test.py ]; then
            python experiments/provenance/test_prototype.py
            python experiments/provenance/test_cost_study.py
            python experiments/provenance/postgres_test.py --schema mtw_provenance_ci --output verification/provenance-prototypes/ci
          fi
      - name: Verify experimental ordinary-table capture profile
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          if [ -f experiments/provenance/capture_profile_e2e.mjs ]; then
            python experiments/provenance/test_capture_profile.py
            node experiments/provenance/capture_profile_e2e.mjs --schema mtw_provenance_profile_ci --output verification/provenance-profile/ci
          fi
      - name: Verify frozen existing-lease business integration
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          if [ -f experiments/business/dislock/e2e.mjs ]; then
            python experiments/provenance/test_returning_profile.py
            python experiments/business/dislock/test_business.py
            node experiments/business/dislock/e2e.mjs --schema mtw_provenance_dislock_ci --output verification/business/dislock/ci
          fi
      - name: Verify experimental CRUD and negative-read projection
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          if [ -f experiments/provenance/presence_e2e.mjs ]; then
            python -B scripts/presence-unit-test.py --node "$(command -v node)"
            node experiments/provenance/presence_e2e.mjs --schema mtw_provenance_presence_ci --output verification/provenance-presence/ci-${{ github.run_id }}-${{ github.run_attempt }}
            python -B experiments/provenance/initialization_postgres.py --schema mtw_provenance_initialization_ci --output verification/provenance-presence/ci-${{ github.run_id }}-${{ github.run_attempt }}/initialization
          fi
      - name: Verify v3 savepoint and cursor observations on PostgreSQL
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B experiments/lifecycle_v3/postgres.py --schema mtw_provenance_lifecycle_v3_ci --output verification/v3/postgres-ci
          node experiments/lifecycle_v3/e2e.mjs verification/v3/postgres-ci
      - name: Verify append-list observations and repair across 20 rounds per scenario
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B experiments/list_v3/postgres.py --schema mtw_list_v3_ci --output verification/list-v3/postgres-ci
          node experiments/list_v3/e2e.mjs verification/list-v3/postgres-ci
      - name: Verify relational observations across 20 rounds per scenario
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B experiments/relation_v3/test_fixture.py
          python -B experiments/relation_v3/run_postgres.py --schema mtw_relation_v3_000000000001 --output verification/relation-v3/postgres-ci
          node experiments/relation_v3/e2e.mjs verification/relation-v3/postgres-ci verification/relation-v3/postgres-ci-model
      - name: Exercise original dislock lifecycle with bounded v3 observations
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B experiments/business/dislock/v3_postgres.py --schema mtw_provenance_dislock_v3_ci --output verification/business/dislock/v3-ci
          node experiments/business/dislock/v3_e2e.mjs verification/business/dislock/v3-ci
      - name: Verify actual commit-time serialization-abort protocol
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B experiments/business/dislock/v3_commit_postgres.py --schema mtw_provenance_dislock_commit_ci --output verification/business/dislock/v3-commit-ci
          node experiments/business/dislock/v3_commit_e2e.mjs verification/business/dislock/v3-commit-ci
      - name: Reproduce original MLflow component deadlock and repaired locking order
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -m pip install --require-hashes -r experiments/faults/mlflow/requirements.txt
          python -B experiments/faults/mlflow/run_postgres.py --output verification/faults/mlflow/ci
          node experiments/faults/mlflow/e2e.mjs verification/faults/mlflow/ci --output verification/faults/mlflow/ci-model
      - name: Record database input bindings after execution
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {verificationFingerprint} from './scripts/verification-fingerprint.mjs';
          const runId=process.env.GITHUB_RUN_ID,attempt=process.env.GITHUB_RUN_ATTEMPT;
          if(!/^[1-9][0-9]*$/.test(runId??'')||!/^[1-9][0-9]*$/.test(attempt??''))throw new Error('Missing or invalid GitHub run identity');
          const directory=`verification/postgres-ci-runtime/${runId}-${attempt}`;
          mkdirSync(directory,{recursive:true});
          const record={phase:'after',sourceCommit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),buildManifest:JSON.parse(readFileSync('dist/build-manifest.json')),testedFileSha256:verificationFingerprint(process.cwd())};
          writeFileSync(`${directory}/postgres-ci-runtime-after.json`,JSON.stringify(record,null,2)+'\n',{flag:'wx'});
          JS
      - name: Preserve complete database server logs
        if: always()
        env:
          MTW_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p verification
          docker logs "$MTW_SERVICE_ID" > verification/postgres-server.log 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: actual-postgresql-evidence
          path: |
            verification/postgres.json
            verification/postgres-server.log
            verification/postgres-ci-source.json
            verification/capture-postgres.json
            verification/releases/*/postgres/
            verification/releases/*/capture/
            verification/provenance-prototypes/ci/
            verification/provenance-profile/ci/
            verification/business/dislock/ci/
            verification/business/dislock/v3-ci/
            verification/business/dislock/v3-commit-ci/
            verification/provenance-presence/ci-*/
            verification/v3/postgres-ci/
            verification/list-v3/postgres-ci/
            verification/relation-v3/postgres-ci/
            verification/relation-v3/postgres-ci-model/
            verification/faults/mlflow/ci/
            verification/faults/mlflow/ci-model/
            verification/model-profile-v3/postgres-ci-*/
            verification/configured-session-v4/postgres-ci-*/
            verification/configured-point-v4/postgres-ci-*/
            verification/configured-window-v2/postgres-ci-*/
            verification/postgres-ci-runtime/${{ github.run_id }}-${{ github.run_attempt }}/
            dist/
