name: Verify actual PostgreSQL 18
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional immutable release tag to verify with this workflow
        required: false
        default: ''
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: mtw
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: mtw_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U mtw -d mtw_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MOONBIT_INSTALL_VERSION: 0.10.14+7d59c7ec9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned MoonBit
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build offline analyzer
        run: npm run build
      - name: Install frozen optional database driver
        run: python -m pip install --require-hashes -r examples/postgres-requirements.txt
      - name: Capture all ten configured model scenarios and verify the current build
        shell: bash
        env:
          MTW_MODEL_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          MTW_MODEL_CONNECTION: ${{ runner.temp }}/moontxnwitness-model-profile-${{ github.run_id }}-${{ github.run_attempt }}.json
          MTW_PYTHON: python
        run: |
          set -euo pipefail
          umask 077
          python -I -B - <<'PY'
          import json, os, pathlib
          connection = pathlib.Path(os.environ['MTW_MODEL_CONNECTION'])
          assert connection.parent.resolve() == pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          with connection.open('x', encoding='utf-8') as stream:
              json.dump({'host':'127.0.0.1', 'port':int(os.environ['MTW_MODEL_PG_PORT']),
                         'dbname':'mtw_test', 'user':'mtw', 'password':'fixture-only'}, stream)
          PY
          trap 'rm -f -- "$MTW_MODEL_CONNECTION"' EXIT
          python -B experiments/model_profile_v3/driver_cases.py \
            --connection-file "$MTW_MODEL_CONNECTION" \
            --output verification/model-profile-v3/postgres-ci/suite
          node experiments/model_profile_v3/verify_cases.mjs \
            verification/model-profile-v3/postgres-ci/suite \
            verification/model-profile-v3/postgres-ci/projection
      - name: Capture and reproduce 20 rounds per isolation scenario
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: npm run postgres:verify
      - name: Record the actual checked-out source commit
        # New source refs include a conservative driver capture adapter.
        if: always()
        env:
          MTW_WORKFLOW_SHA: ${{ github.sha }}
          MTW_REQUESTED_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          pathlib.Path('verification/postgres-ci-source.json').write_text(json.dumps({'sourceCommit':source,'workflowCommit':os.environ['MTW_WORKFLOW_SHA'],'requestedRef':os.environ['MTW_REQUESTED_REF']}, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Verify automatic capture against actual PostgreSQL
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          if [ -f scripts/capture-postgres-e2e.mjs ]; then
            npm run capture:verify
          fi
      - name: Verify experimental provenance on ordinary tables
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          if [ -f experiments/provenance/postgres_test.py ]; then
            python experiments/provenance/test_prototype.py
            python experiments/provenance/test_cost_study.py
            python experiments/provenance/postgres_test.py --schema mtw_provenance_ci --output verification/provenance-prototypes/ci
          fi
      - name: Verify experimental ordinary-table capture profile
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          if [ -f experiments/provenance/capture_profile_e2e.mjs ]; then
            python experiments/provenance/test_capture_profile.py
            node experiments/provenance/capture_profile_e2e.mjs --schema mtw_provenance_profile_ci --output verification/provenance-profile/ci
          fi
      - name: Verify frozen existing-lease business integration
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          if [ -f experiments/business/dislock/e2e.mjs ]; then
            python experiments/provenance/test_returning_profile.py
            python experiments/business/dislock/test_business.py
            node experiments/business/dislock/e2e.mjs --schema mtw_provenance_dislock_ci --output verification/business/dislock/ci
          fi
      - name: Verify experimental CRUD and negative-read projection
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          if [ -f experiments/provenance/presence_e2e.mjs ]; then
            python -B scripts/presence-unit-test.py --node "$(command -v node)"
            node experiments/provenance/presence_e2e.mjs --schema mtw_provenance_presence_ci --output verification/provenance-presence/ci
            python -B experiments/provenance/initialization_postgres.py --schema mtw_provenance_initialization_ci --output verification/provenance-presence/ci/initialization
          fi
      - name: Verify v3 savepoint and cursor observations on PostgreSQL
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B experiments/lifecycle_v3/postgres.py --schema mtw_provenance_lifecycle_v3_ci --output verification/v3/postgres-ci
          node experiments/lifecycle_v3/e2e.mjs verification/v3/postgres-ci
      - name: Verify append-list observations and repair across 20 rounds per scenario
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B experiments/list_v3/postgres.py --schema mtw_list_v3_ci --output verification/list-v3/postgres-ci
          node experiments/list_v3/e2e.mjs verification/list-v3/postgres-ci
      - name: Verify relational observations across 20 rounds per scenario
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B experiments/relation_v3/test_fixture.py
          python -B experiments/relation_v3/run_postgres.py --schema mtw_relation_v3_000000000001 --output verification/relation-v3/postgres-ci
          node experiments/relation_v3/e2e.mjs verification/relation-v3/postgres-ci verification/relation-v3/postgres-ci-model
      - name: Exercise original dislock lifecycle with bounded v3 observations
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B experiments/business/dislock/v3_postgres.py --schema mtw_provenance_dislock_v3_ci --output verification/business/dislock/v3-ci
          node experiments/business/dislock/v3_e2e.mjs verification/business/dislock/v3-ci
      - name: Verify actual commit-time serialization-abort protocol
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -B experiments/business/dislock/v3_commit_postgres.py --schema mtw_provenance_dislock_commit_ci --output verification/business/dislock/v3-commit-ci
          node experiments/business/dislock/v3_commit_e2e.mjs verification/business/dislock/v3-commit-ci
      - name: Reproduce original MLflow component deadlock and repaired locking order
        env:
          MTW_PG_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=mtw_test user=mtw password=fixture-only
        run: |
          python -m pip install --require-hashes -r experiments/faults/mlflow/requirements.txt
          python -B experiments/faults/mlflow/run_postgres.py --output verification/faults/mlflow/ci
          node experiments/faults/mlflow/e2e.mjs verification/faults/mlflow/ci --output verification/faults/mlflow/ci-model
      - name: Preserve complete database server logs
        if: always()
        env:
          MTW_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p verification
          docker logs "$MTW_SERVICE_ID" > verification/postgres-server.log 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: actual-postgresql-evidence
          path: |
            verification/postgres.json
            verification/postgres-server.log
            verification/postgres-ci-source.json
            verification/capture-postgres.json
            verification/releases/*/postgres/
            verification/releases/*/capture/
            verification/provenance-prototypes/ci/
            verification/provenance-profile/ci/
            verification/business/dislock/ci/
            verification/business/dislock/v3-ci/
            verification/business/dislock/v3-commit-ci/
            verification/provenance-presence/ci/
            verification/v3/postgres-ci/
            verification/list-v3/postgres-ci/
            verification/relation-v3/postgres-ci/
            verification/relation-v3/postgres-ci-model/
            verification/faults/mlflow/ci/
            verification/faults/mlflow/ci-model/
            verification/model-profile-v3/postgres-ci/suite/database-receipt.json
            verification/model-profile-v3/postgres-ci/suite/*-failure.txt
            verification/model-profile-v3/postgres-ci/suite/*/profile-source.json
            verification/model-profile-v3/postgres-ci/suite/*/sources.jsonl
            verification/model-profile-v3/postgres-ci/suite/*/sources.jsonl.index.json
            verification/model-profile-v3/postgres-ci/suite/*/capture/
            verification/model-profile-v3/postgres-ci/projection/
            dist/
