name: Fixed2000 original Elle and public027 serializable comparison
on:
  push:
    branches: [experiment/elle-v028-campaign]
    paths:
      - '.github/workflows/elle-v028-campaign.yml'
      - 'experiments/elle/v028/hosted_campaign.py'
      - 'experiments/elle/v028/campaign-*'
      - 'experiments/elle/v028/campaign-evidence/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: elle-v028-fixed2000-campaign
  cancel-in-progress: false
jobs:
  fixed2000:
    if: github.repository == 'HhWw96/moontxnwitness' && github.event_name == 'push' && github.ref == 'refs/heads/experiment/elle-v028-campaign'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify exact new source and future execution authorization
        run: |
          export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          python -B -c "import hashlib,sys;from pathlib import Path;p,h=sys.argv[1:3];b=Path(p).read_bytes();assert hashlib.sha256(b).hexdigest()==h;sys.argv=[p,*sys.argv[3:]];exec(compile(b,p,'exec'),{'__name__':'__main__','__file__':p,'__verified_source_sha256__':h})" experiments/elle/v028/hosted_campaign.py f6268bc0f1c21263abe39b7a3901927f2ada80678cc0ae8298e8d62512c6a5a6 --phase preflight --source-manifest-sha256 2efff6353e39f8e70c2f12b363928453deca65381736262aad8eab578608fa7e --execute-hosted-campaign
      - name: Fetch the unchanged independently admitted runtime only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mtw-elle-v028-campaign-first"
          archive="$RUNNER_TEMP/mtw-elle-v028-campaign-runtime.original.zip"
          test ! -e "$archive"
          gh api --hostname github.com repos/HhWw96/moontxnwitness/actions/artifacts/12573702295 > "$out/runtime-artifact-metadata.original.json"
          gh api --hostname github.com repos/HhWw96/moontxnwitness/actions/artifacts/12573702295/zip > "$archive"
          test "$(wc -c < "$archive")" -eq 41509254
          printf '%s\n' '2743c7e87adf2155fb20b737eada555ef3cd45f6e3f7ce956079175f979d3731  mtw-elle-v028-campaign-runtime.original.zip' > "$out/runtime.expected.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$out/runtime.expected.sha256")
      - name: Anonymously download the fixed public027 portable
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mtw-elle-v028-campaign-first"
          archive="$RUNNER_TEMP/mtw-elle-v028-campaign-public027.original.zip"
          test ! -e "$archive"
          env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --location --retry 0 --silent --show-error --dump-header "$out/public027.headers.original" --output "$archive" 'https://github.com/HhWw96/moontxnwitness/releases/download/v0.2.7/MoonTxnWitness-v0.2.7-portable.zip' 2> "$out/public027.stderr.original"
          test "$(wc -c < "$archive")" -eq 49656319
          printf '%s\n' '4de093877bd75d55e327c5015484aead587e5be59bd22818d035c0fed4298c3d  mtw-elle-v028-campaign-public027.original.zip' > "$out/public027.expected.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$out/public027.expected.sha256")
      - name: Execute each original fifty-case batch and public SDK with first-stop
        run: |
          export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          export CAMPAIGN_NODE="$(command -v node)"
          python -B -c "import hashlib,sys;from pathlib import Path;p,h=sys.argv[1:3];b=Path(p).read_bytes();assert hashlib.sha256(b).hexdigest()==h;sys.argv=[p,*sys.argv[3:]];exec(compile(b,p,'exec'),{'__name__':'__main__','__file__':p,'__verified_source_sha256__':h})" experiments/elle/v028/hosted_campaign.py f6268bc0f1c21263abe39b7a3901927f2ada80678cc0ae8298e8d62512c6a5a6 --phase execute --source-manifest-sha256 2efff6353e39f8e70c2f12b363928453deca65381736262aad8eab578608fa7e --execute-hosted-campaign
      - name: Preserve all original evidence including partial failures and hidden files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elle-fixed2000-common-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mtw-elle-v028-campaign-first/
            ${{ runner.temp }}/mtw-elle-v028-campaign-runtime.original.zip
            ${{ runner.temp }}/mtw-elle-v028-campaign-public027.original.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
