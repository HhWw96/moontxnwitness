name: Measure full capture A B C cost
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact forty-character source commit containing the frozen protocol
        required: true
        type: string
      profile:
        description: Controlled provenance profile
        required: true
        type: choice
        options: [column, sidecar]
      source_write_buffer_bytes:
        description: Explicit C-source buffer in bytes; 0 preserves the legacy plan
        required: true
        type: choice
        default: '0'
        options: ['0', '65536']
      experimental_budget:
        description: Explicit measurement-only storage profile; legacy keeps published limits
        required: true
        type: choice
        default: legacy
        options: [legacy, full-capture-cost-capacity/v2]
permissions:
  contents: read
jobs:
  capture-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      MTW_COST_SOURCE: ${{ inputs.source_sha }}
      MTW_COST_PROFILE: ${{ inputs.profile }}
      MTW_COST_BUDGET: ${{ inputs.experimental_budget }}
      MTW_COST_SOURCE_BUFFER: ${{ inputs.source_write_buffer_bytes }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Configure runner-local scratch paths
        timeout-minutes: 2
        run: |
          echo "MTW_PG_CONNECTION_FILE=$RUNNER_TEMP/mtw-cost-connection.json" >> "$GITHUB_ENV"
          echo "MTW_JOURNAL_TEST_ROOT=$RUNNER_TEMP/mtw-cost-units" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - name: Bind exact source and validate protocol offline
        timeout-minutes: 10
        run: |
          python - <<'PY'
          import os,re,subprocess
          source=os.environ['MTW_COST_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}',source)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          PY
          python -m pip install --require-hashes -r examples/postgres-requirements.txt
          export MTW_JOURNAL_SCRATCH="$MTW_JOURNAL_TEST_ROOT"
          mkdir -p "$MTW_JOURNAL_SCRATCH"
          python -B scripts/persistence-unit-test.py
          buffer_args=()
          if [ "$MTW_COST_SOURCE_BUFFER" != "0" ]; then buffer_args=(--source-write-buffer-bytes "$MTW_COST_SOURCE_BUFFER"); fi
          budget_args=()
          if [ "$MTW_COST_BUDGET" != "legacy" ]; then budget_args=(--experimental-budget "$MTW_COST_BUDGET"); fi
          python -B experiments/provenance/full_capture_cost.py --profile "$MTW_COST_PROFILE" --output verification/full-capture-cost/preregistered --plan-only --archive-cells --exclusive-host --exclusive-cluster "${budget_args[@]}" "${buffer_args[@]}"
      - name: Prepare isolated PostgreSQL before measurement
        timeout-minutes: 5
        run: |
          docker run --detach --name mtw-cost --publish 127.0.0.1:55437:5432 --env POSTGRES_USER=mtw_cost --env POSTGRES_PASSWORD=fixture-only --env POSTGRES_DB=mtw_cost --env POSTGRES_INITDB_ARGS='--encoding=UTF8 --locale=C' postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c -c shared_buffers=32MB -c max_connections=24 -c work_mem=2MB -c max_wal_size=512MB -c min_wal_size=80MB
          python - <<'PY'
          import json,os,pathlib,platform,subprocess,time
          import psycopg
          connection={'host':'127.0.0.1','port':55437,'user':'mtw_cost','password':'fixture-only','dbname':'mtw_cost','connect_timeout':3}
          pathlib.Path(os.environ['MTW_PG_CONNECTION_FILE']).write_text(json.dumps(connection),encoding='utf8')
          for attempt in range(60):
              try:
                  with psycopg.connect(**connection,autocommit=True) as db:
                      server=db.execute('SELECT version()').fetchone()[0]
                  break
              except psycopg.OperationalError:
                  if attempt==59:raise
                  time.sleep(1)
          out=pathlib.Path('verification/full-capture-cost')
          metadata={'sourceCommit':os.environ['MTW_COST_SOURCE'],'profile':os.environ['MTW_COST_PROFILE'],'python':platform.python_version(),'driver':psycopg.__version__,'platform':platform.platform(),'server':server,'cpu':subprocess.check_output(['lscpu'],text=True),'filesystem':subprocess.check_output(['df','-h','.'],text=True),'filesystemBytes':subprocess.check_output(['df','-B1','.',os.environ['RUNNER_TEMP']],text=True),'memory':pathlib.Path('/proc/meminfo').read_text(encoding='ascii'),'experimentalBudget':os.environ['MTW_COST_BUDGET'],'dockerImageId':subprocess.check_output(['docker','inspect','--format','{{.Image}}','mtw-cost'],text=True).strip(),'environment':'Dedicated GitHub-hosted job and owned PostgreSQL container; underlying physical-host tenancy is not measured','exclusiveTaskWindow':'All downloads, installs and tests complete before timing; no build, packaging or other database suite in this job during measurement','formalResultNotPredetermined':True}
          if os.environ['MTW_COST_SOURCE_BUFFER']!='0':metadata['sourceWriteBufferBytes']=int(os.environ['MTW_COST_SOURCE_BUFFER'])
          (out/'environment.json').write_text(json.dumps(metadata,indent=2)+'\n',encoding='utf8')
          PY
      - name: Execute all thirty-six preregistered full-duration cells once
        timeout-minutes: 180
        run: |
          export MTW_JOURNAL_SCRATCH="$MTW_JOURNAL_TEST_ROOT"
          mkdir -p "$MTW_JOURNAL_SCRATCH"
          buffer_args=()
          if [ "$MTW_COST_SOURCE_BUFFER" != "0" ]; then buffer_args=(--source-write-buffer-bytes "$MTW_COST_SOURCE_BUFFER"); fi
          budget_args=()
          if [ "$MTW_COST_BUDGET" != "legacy" ]; then budget_args=(--experimental-budget "$MTW_COST_BUDGET"); fi
          python -B experiments/provenance/full_capture_cost.py --profile "$MTW_COST_PROFILE" --output verification/full-capture-cost/measured --archive-cells --exclusive-host --exclusive-cluster "${budget_args[@]}" "${buffer_args[@]}"
      - name: Retain exact plans and qualification separately from timing completion
        timeout-minutes: 10
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('verification/full-capture-cost');root.mkdir(parents=True,exist_ok=True)
          before=root/'preregistered/plan.json';after=root/'measured/plan.json';receipt=root/'measured/receipt.json'
          summary=json.loads(receipt.read_text(encoding='utf8')) if receipt.exists() else {}
          plansEqual=before.is_file() and after.is_file() and before.read_bytes()==after.read_bytes()
          result={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'expectedSourceCommit':os.environ['MTW_COST_SOURCE'],'plansByteIdentical':plansEqual,'planSha256':hashlib.sha256(before.read_bytes()).hexdigest() if before.is_file() else None,'actualDatabaseExecution':summary.get('actualDatabaseExecution',False),'formalProtocolCompleted':summary.get('formalProtocolCompleted',False),'performanceTargetsPassed':summary.get('performanceTargetsPassed',False),'completeCells':summary.get('completeCells',0),'plannedCells':summary.get('plannedCells',36),'performanceSuccessDoesNotFollowFromWorkflowSuccess':True,'experimentalBudget':summary.get('experimentalBudget'),'actualStorageLimits':summary.get('actualStorageLimits'),'capacityChecksBeforeCells':summary.get('capacityChecksBeforeCells',[])}
          if os.environ['MTW_COST_SOURCE_BUFFER']!='0':result['sourceWriteBufferBytes']=int(os.environ['MTW_COST_SOURCE_BUFFER'])
          (root/'hosted-receipt.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf8')
          if receipt.exists():
              assert plansEqual,'Preregistered plan changed'
              assert result['sourceCommit']==result['expectedSourceCommit']
          PY
          docker logs mtw-cost > verification/full-capture-cost/postgres-server.log 2>&1 || true
          docker stop --time 30 mtw-cost || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 30
        if: always()
        with:
          name: full-capture-cost-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            verification/full-capture-cost
            verification/capture-persistence/unit-*
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
