name: Verify published release downloads
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version, without v
        required: true
        type: string
      expected_tag_sha:
        description: Independently recorded full 40-character release tag commit
        required: true
        type: string
      expected_registry_sha256:
        description: SHA-256 of the actual publisher Mooncakes upload ZIP, recorded independently
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  public-downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MOONBIT_INSTALL_VERSION: 0.10.16+b1a0e846e
      MTW_VERSION: ${{ inputs.version }}
      MTW_EXPECTED_TAG_SHA: ${{ inputs.expected_tag_sha }}
      MTW_EXPECTED_REGISTRY_SHA256: ${{ inputs.expected_registry_sha256 }}
      MTW_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      MTW_WORKFLOW_REPOSITORY: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Reject malformed inputs before either checkout
        run: |
          python - <<'PY'
          import os, re
          version = os.environ['MTW_VERSION']
          assert len(version) <= 32 and re.fullmatch(r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', version), 'Canonical stable version required'
          for name, count in [('MTW_EXPECTED_TAG_SHA',40),('MTW_EXPECTED_REGISTRY_SHA256',64),('MTW_WORKFLOW_COMMIT',40)]:
              assert re.fullmatch('[0-9a-f]{'+str(count)+'}', os.environ[name]), 'Full lowercase hexadecimal required: '+name
          assert os.environ['MTW_WORKFLOW_REPOSITORY'] == 'HhWw96/moontxnwitness', 'Declared repository required'
          PY
      - name: Check out workflow controller at its own immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HhWw96/moontxnwitness
          ref: ${{ github.workflow_sha }}
          path: workflow-control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/hosted_publication.py
            /.github/workflows/published-downloads.yml
      - name: Check out the actual release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HhWw96/moontxnwitness
          ref: refs/tags/v${{ inputs.version }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Assert actual HEAD, tag, controller and original verifier bindings
        run: python workflow-control/scripts/hosted_publication.py attest
      - name: Install and record the fixed toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh" "$MOONBIT_INSTALL_VERSION" 2>&1 | tee publication-evidence/toolchain-install.log
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$HOME/.moon" >> "$GITHUB_ENV"
          "$HOME/.moon/bin/moonc" -v > publication-evidence/moonc-version.txt 2>&1
          node --version > publication-evidence/node-version.txt
          python --version > publication-evidence/python-version.txt
          python - <<'PY'
          from pathlib import Path
          p = Path('publication-evidence')
          assert 'v0.10.16+b1a0e846e' in (p/'moonc-version.txt').read_text()
          assert (p/'node-version.txt').read_text().startswith('v24.')
          assert (p/'python-version.txt').read_text().startswith('Python 3.12.')
          PY
      - name: Bind anonymous registry bytes to the independent publisher digest
        # No token, cookie or authenticated browser is supplied to urllib.
        run: python workflow-control/scripts/hosted_publication.py anchor-registry
      - name: Execute the release tag's complete original public verifier
        id: verifier
        env:
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
        # Controller removes this token from the verifier and Moon environments;
        # only its gh wrapper supplies GH_TOKEN to read-only Actions subcommands.
        run: python workflow-control/scripts/hosted_publication.py verify
      - name: Preserve actual generated evidence, including failed attempts
        if: always()
        env:
          MTW_VERIFIER_OUTCOME: ${{ steps.verifier.outcome }}
        run: |
          if [ -f workflow-control/scripts/hosted_publication.py ]; then
            python workflow-control/scripts/hosted_publication.py collect
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: public-download-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-evidence/
          if-no-files-found: warn
          compression-level: 6
