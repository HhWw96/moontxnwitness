name: Verify fixed Elle corpus against public v0.5.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-fixed2000:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MTW_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      MTW_WORKFLOW_REPOSITORY: ${{ github.repository }}
      MTW_WORKFLOW_REF: ${{ github.ref }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate manual workflow identity
        run: |
          python - <<'PY'
          import os,re
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['MTW_WORKFLOW_REPOSITORY'] == 'HhWw96/moontxnwitness'
          assert os.environ['MTW_WORKFLOW_REF'] == 'refs/heads/automation/elle-fixed2000-public-v2'
          assert re.fullmatch('[a-f0-9]{40}',os.environ['MTW_WORKFLOW_COMMIT'])
          PY
      - name: Check out trusted tools at this workflow's exact immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HhWw96/moontxnwitness
          ref: ${{ github.workflow_sha }}
          path: workflow-control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/public-fixed-elle-v2/
            /.github/workflows/published-downloads.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Bind actual checkout and tool versions
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'mtw-fixed2000-public-tests'
          root.mkdir()
          actual=subprocess.check_output(['git','-C','workflow-control','rev-parse','HEAD'],text=True).strip()
          assert actual == os.environ['MTW_WORKFLOW_COMMIT']
          node=subprocess.check_output(['node','--version'],text=True).strip()
          assert node.startswith('v24.') and sys.version_info[:2] == (3,12)
          (root/'workflow-checkout.json').write_text(json.dumps({'workflowSha':actual,'python':sys.version,'node':node},indent=2)+'\n')
          PY
      - name: Exercise mock-only boundary tests
        run: |
          python -B workflow-control/scripts/public-fixed-elle-v2/test_hosted_public_validation.py > "$RUNNER_TEMP/mtw-fixed2000-public-tests/python-mock-tests.log" 2>&1
          node --test workflow-control/scripts/public-fixed-elle-v2/test_compare_sdk_v2.mjs > "$RUNNER_TEMP/mtw-fixed2000-public-tests/node-mock-tests.log" 2>&1
      - name: Download anonymous public data and SDK, validate, then compare all 2000 inputs
        run: |
          python -I -B workflow-control/scripts/public-fixed-elle-v2/hosted_public_validation.py \
            --tools "$GITHUB_WORKSPACE/workflow-control/scripts/public-fixed-elle-v2" \
            --workflow-sha "$MTW_WORKFLOW_COMMIT" \
            --output "$RUNNER_TEMP/mtw-fixed2000-public-run"
      - name: Preserve complete results and actual public compiled core
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-fixed2000-v050-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mtw-fixed2000-public-run/results/
            ${{ runner.temp }}/mtw-fixed2000-public-tests/
          if-no-files-found: warn
          compression-level: 6
