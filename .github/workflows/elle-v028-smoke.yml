name: Admitted original-eight Elle smoke only
on:
  push:
    branches: [experiment/elle-v028-smoke]
    paths:
      - '.github/workflows/elle-v028-smoke.yml'
      - 'experiments/elle/v028/hosted_smoke.py'
      - 'experiments/elle/v028/smoke-stage.json'
      - 'experiments/elle/v028/smoke-execution-source-manifest.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: elle-v028-original-eight-smoke
  cancel-in-progress: false
jobs:
  original-eight:
    if: github.repository == 'HhWw96/moontxnwitness' && github.event_name == 'push' && github.ref == 'refs/heads/experiment/elle-v028-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate external admission and exact smoke source before download
        run: |
          export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          python -B -c "import hashlib,sys;from pathlib import Path;p,h=sys.argv[1:3];b=Path(p).read_bytes();assert hashlib.sha256(b).hexdigest()==h;sys.argv=[p,*sys.argv[3:]];exec(compile(b,p,'exec'),{'__name__':'__main__','__file__':p,'__verified_source_sha256__':h})" experiments/elle/v028/hosted_smoke.py d8bff60353abe61720f3d6345c84154ae9bad60b17076bf891fea278b5af42e2 --phase preflight --source-manifest-sha256 eed9fb7fad2397d0f7273a191b576c6e93164ed10882445826ba319313c5f7fb
      - name: Fetch only the already admitted original runtime artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mtw-elle-v028-smoke-first"
          archive="$RUNNER_TEMP/mtw-elle-v028-smoke-runtime-original.zip"
          test ! -e "$out/artifact-metadata.original.json"
          test ! -e "$archive"
          gh api --hostname github.com repos/HhWw96/moontxnwitness/actions/artifacts/12573702295 > "$out/artifact-metadata.original.json"
          gh api --hostname github.com repos/HhWw96/moontxnwitness/actions/artifacts/12573702295/zip > "$archive"
          printf '%s\n' '2743c7e87adf2155fb20b737eada555ef3cd45f6e3f7ce956079175f979d3731  mtw-elle-v028-smoke-runtime-original.zip' > "$out/artifact.expected.sha256"
          test "$(wc -c < "$archive")" -eq 41509254
          (cd "$RUNNER_TEMP" && sha256sum -c "$out/artifact.expected.sha256")
      - name: Restore exact runtime and execute the original8 once
        run: |
          export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          python -B -c "import hashlib,sys;from pathlib import Path;p,h=sys.argv[1:3];b=Path(p).read_bytes();assert hashlib.sha256(b).hexdigest()==h;sys.argv=[p,*sys.argv[3:]];exec(compile(b,p,'exec'),{'__name__':'__main__','__file__':p,'__verified_source_sha256__':h})" experiments/elle/v028/hosted_smoke.py d8bff60353abe61720f3d6345c84154ae9bad60b17076bf891fea278b5af42e2 --phase execute --source-manifest-sha256 eed9fb7fad2397d0f7273a191b576c6e93164ed10882445826ba319313c5f7fb
      - name: Preserve complete first smoke evidence including hidden files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elle-original-eight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mtw-elle-v028-smoke-first/
            ${{ runner.temp }}/mtw-elle-v028-smoke-runtime-original.zip
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 6
