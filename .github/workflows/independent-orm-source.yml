name: Independently audit ORM source runtime
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  downloaded-source2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUDIT_TOOL: verification/public-audit-tools/orm-source2-r3-r2-2026-10-21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify fixed independent audit and acceptance contract
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          base = Path(os.environ['AUDIT_TOOL'])
          files = {
              'audit.py': 'bd7e952bb7f292a255c607ed7ff80784800e7598f8e57e5711deb36e51bc7dc6',
              'runtime.mjs': '6f2bf2fe5fcd9e67990cf43fb4069651507a1b48ee057e4da44ec4974cb2d5e3',
              'transport.py': 'f65c78c032f93a7b05366e04adbfc30ca49ede664d3bb4544af4b64142f22476',
              'profile.json': 'c3ad9858cfb46c39bae50d47b5a57a3138c7bd9467d429faa04514a4c4287746',
              'contract-v1.json': '2e30dcccb17920312a50f88048ffcd4049a99fb9e2818d6d6d9c92feb4017051',
          }
          for name, expected in files.items():
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == expected, name
          print('Independent source and expectations match their frozen bytes.')
          PY
      - name: Download actual public runtime and fixed original raw inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: python -B "$AUDIT_TOOL/audit.py" --phase fetch --work "$RUNNER_TEMP/orm-r3-independent"
      - name: Run independent source replay and 24 cases without credentials
        shell: bash
        run: python -B "$AUDIT_TOOL/audit.py" --phase audit --work "$RUNNER_TEMP/orm-r3-independent"
      - name: Preserve actual module, inputs, original failures and independent cases
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-orm-source2-r3
          if-no-files-found: error
          compression-level: 6
          path: |
            ${{ runner.temp }}/orm-r3-independent/*.json
            ${{ runner.temp }}/orm-r3-independent/*.stdout
            ${{ runner.temp }}/orm-r3-independent/*.stderr
            ${{ runner.temp }}/orm-r3-independent/artifact/**
            ${{ runner.temp }}/orm-r3-independent/inputs/**
            ${{ runner.temp }}/orm-r3-independent/result/**
