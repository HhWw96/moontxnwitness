name: Verify clean point-window consumers
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Public release version without a v prefix
        required: true
        type: string
      portable_sha256:
        description: SHA-256 of the public GitHub portable archive
        required: true
        type: string
      registry_sha256:
        description: SHA-256 of the actual Mooncakes publisher archive
        required: true
        type: string
permissions:
  contents: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MTW_CONSUMER_VERSION: ${{ inputs.version || '0.6.4' }}
      MTW_PORTABLE_SHA256: ${{ inputs.portable_sha256 || '53483a92b1449667914456a7999ce28ad3406e1389467b86661d736e7e7bfdfc' }}
      MTW_REGISTRY_SHA256: ${{ inputs.registry_sha256 || 'da3f4c960b4167bedd5da616327a80cadf3cfe5d744d8232ef07c508fd944559' }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the fixed MoonBit toolchain
        shell: bash
        run: python -B scripts/install_moonbit.py --home "$RUNNER_TEMP/consumer-moonbit" --github-env
      - name: Verify the public runtime and a new registry consumer
        shell: bash
        run: >-
          python -B scripts/verify-downstream-point-consumer.py
          --version "$MTW_CONSUMER_VERSION"
          --portable-sha256 "$MTW_PORTABLE_SHA256"
          --registry-sha256 "$MTW_REGISTRY_SHA256"
          --output "$RUNNER_TEMP/point-window-consumer"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: public-point-window-consumer-${{ matrix.os }}
          path: ${{ runner.temp }}/point-window-consumer/receipt.json
          if-no-files-found: warn
