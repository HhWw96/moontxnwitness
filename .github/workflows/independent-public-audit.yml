name: Produce authentic public v025 compatibility fixtures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact reviewed scripts and public release receipts
        shell: bash
        run: |
          python -I -B - <<'PY'
          from pathlib import Path
          import json,hashlib
          for n,r in json.loads(Path('ci/input-bindings.json').read_bytes()).items():
              b=Path(n).read_bytes()
              assert len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256'],n
          PY
      - name: Anonymous public25 downloads and natural original runtime production
        timeout-minutes: 25
        run: >-
          python -I -B tools/run_after_publication.py
          --publication-receipt ci/publication.json
          --publisher-upload-reference ci/publisher-upload.json
          --expected-source 6b3434b19fc080bc9a3a9518950021061d2849dd
          --expected-sums-sha256 8ee8b676823c68369e504c4ac57af4011f062a1d93029cd02a3bc0fa635e9a32
          --out "${{ runner.temp }}/public025-first"
          --execute-after-publication
      - name: Preserve original public archives and partial downloads
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: actual-public025-original-downloads
          compression-level: 0
          if-no-files-found: warn
          path: ${{ runner.temp }}/public025-first/downloads/
      - name: Preserve original producers, exact runtime and all first failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: actual-public025-producer
          compression-level: 6
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/public025-first/provider/
            ${{ runner.temp }}/public025-first/fixtures/
            ${{ runner.temp }}/public025-first/*.json
            ${{ runner.temp }}/public025-first/*.log
            tools/
            ci/
