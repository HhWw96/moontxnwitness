name: Preregistered structured v0.2.8 reduction performance

on:
  push:
    branches:
      - experimental/v028-structured-performance-20261025

permissions:
  contents: read
  actions: read

concurrency:
  group: v028-structured-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance:
    if: github.repository == 'HhWw96/moontxnwitness' && github.event_name == 'push' && github.ref == 'refs/heads/experimental/v028-structured-performance-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      MTW_HELPER_SHA: 449ee98820ec301ac190d98c0a7c1df6bc94bc0ed7efcfef23babd842a8a5ba9
    steps:
      - name: Checkout the exact experimental source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up the same Node for both runtimes
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Python for read-only archive preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact parent and prepare frozen source files
        shell: bash
        run: python -I -B scripts/performance/prepare_v028_structured_performance.py preflight
      - name: Download the single original hosted differential artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          work="$RUNNER_TEMP/moontxnwitness-v028-structured-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$work/artifact-metadata.original.json"
          test ! -e "$work/original-artifact.zip"
          gh api --hostname github.com repos/HhWw96/moontxnwitness/actions/artifacts/12576156486 > "$work/artifact-metadata.original.json"
          gh api --hostname github.com repos/HhWw96/moontxnwitness/actions/artifacts/12576156486/zip > "$work/original-artifact.zip"
          printf '%s\n' 'bf0bd2331aa76e48ce211cb2274dccbc68bd029123c903246d84eaad0091c519  original-artifact.zip' > "$work/original-artifact.expected.sha256"
          test "$(wc -c < "$work/original-artifact.zip")" -eq 12484944
          (cd "$work" && sha256sum -c original-artifact.expected.sha256)
      - name: Validate every member and extract the exact two runtime closures
        shell: bash
        run: python -I -B scripts/performance/prepare_v028_structured_performance.py extract
      - name: Run the one serial preregistered measurement
        shell: bash
        run: |
          work="$RUNNER_TEMP/moontxnwitness-v028-structured-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          MOONTXN_PERF_EXCLUSIVE_JOB=1 node "$work/bundle/run.mjs" --plan "$work/bundle/plan.json" --expected-plan-sha256 3a0c6bb7704eba706423c41a4d2ed032aea13029a12fae6a090b1b28a8a1d1b0 --out "$work/results" --execute-exclusive-linux-hosted > "$work/controller.stdout.original" 2> "$work/controller.stderr.original"
          status=$?
          printf '%s\n' "$status" > "$work/controller.exit.original"
          exit "$status"
      - name: Preserve all original inputs and successful or failed output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 6
          path: |
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/original-artifact.zip
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/artifact-metadata.original.json
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/original-artifact.expected.sha256
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/source-attestation.json
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/PREFLIGHT.json
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/runtime-preparation.json
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/*-FIRST-FAILED.json
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/controller.*
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/bundle/*.mjs
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/bundle/plan.json
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/bundle/inputs/
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/bundle/evidence/
            ${{ runner.temp }}/moontxnwitness-v028-structured-performance-${{ github.run_id }}-${{ github.run_attempt }}/results/
