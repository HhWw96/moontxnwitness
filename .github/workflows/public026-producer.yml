name: Generate authentic public v0.2.6 evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public026-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set the fresh output path at runtime
        shell: bash
        run: |
          printf '%s\n' "PUBLIC026_OUT=$RUNNER_TEMP/moontxnwitness-public026-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/public026/
            /.github/workflows/public026-producer.yml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
      - name: Verify unchanged producer tools and original public pins
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('scripts/public026')
          pins = {
              'run_after_publication.py': '5eaa31bff3ca7ef53b9a354532981aac9879baf8c2a8bebb6e9b68a677a8f993',
              'prepare_public026_provider.py': '267608f6c5fdf142927732c95e0c18a1a5be620d39177f5b66a77db42620ffd5',
              'generate_public026_fixtures.mjs': 'afec51bc69eb70c738fc85f4a768c0c69d8e28b5060fa1691ed454d6867eaa13',
              'inputs/publication.json': 'fa5a6df0ab5c9b456b1a59bfb6a834283b6d6e9c56c83f57a4f05b4b08444548',
              'inputs/publisher-upload.json': '861cc482065c525d0ba13cf4dd29ad49ec8b281f0e471d620f600034b00bcc26',
              'inputs/external-asset-bindings.json': '293bc5325b6a69756a4e69b4d17d0b53b2c2339a92fcf57a0ce72678cfcd2021',
          }
          for name, expected in pins.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          PY
      - name: Download anonymously and execute only the original published producer
        shell: bash
        run: |
          set -euo pipefail
          python -I -B scripts/public026/run_after_publication.py \
            --publication-receipt scripts/public026/inputs/publication.json \
            --publisher-upload-reference scripts/public026/inputs/publisher-upload.json \
            --asset-bindings scripts/public026/inputs/external-asset-bindings.json \
            --expected-bindings-sha256 293bc5325b6a69756a4e69b4d17d0b53b2c2339a92fcf57a0ce72678cfcd2021 \
            --expected-source 4c74fd29f45c2e6756a20881fefb03677fa9bf52 \
            --out "$PUBLIC026_OUT" --execute-after-publication
      - name: Preserve original fixtures and failed stages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genuine-public026-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PUBLIC026_OUT }}/*.json
            ${{ env.PUBLIC026_OUT }}/*.log
            ${{ env.PUBLIC026_OUT }}/fixtures/
            ${{ env.PUBLIC026_OUT }}/provider/
          if-no-files-found: warn
          compression-level: 6
