name: Verify MoonTxnWitness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      MTW_INPUT_CACHE: ${{ github.workspace }}/artifacts/input-cache
    steps:
      - name: Enable long paths for the Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check repository size and source boundaries
        run: python scripts/repository_hygiene.py
      - name: Test repository index protections
        run: python -B -m unittest discover -s scripts -p test_repository_hygiene.py -v
      - name: Test bounded receipt storage
        run: python -B -m unittest discover -s scripts -p test_evidence_json.py -v
      - name: Test exact-source PostgreSQL CI import boundaries
        run: python -B -m unittest discover -s scripts -p 'test_postgres_ci_*.py' -v
      - name: Test optional writer checkpoint commit boundaries
        run: python -B -m unittest discover -s scripts -p test_auto_writer_checkpoint.py -v
      - name: Test frozen input cache faults
        run: python -B -m unittest discover -s scripts -p test_input_cache.py -v
      - name: Test independent relation semantics and comparison failures
        run: python -B -m unittest discover -s scripts -p 'test_relation_models*.py' -v
      - name: Test exact-source GitHub release controller
        run: python -B -m unittest discover -s scripts -p test_publish_github_ci_release.py -v
      - name: Check package and publication contracts before compilation
        run: python -B scripts/preflight_release.py
      - name: Install the checksum-pinned MoonBit toolchain
        shell: bash
        run: python -B scripts/install_moonbit.py --home "$RUNNER_TEMP/moonbit" --github-env
      - name: Validate active compiler version
        run: node scripts/toolchain-policy.mjs
      - name: Test compiler version boundaries
        run: node scripts/toolchain-policy-test.mjs
      - name: Run the MoonBit library example
        run: node scripts/moon.mjs run --target wasm-gc src/demo
      - name: Run the dependency inference extension example
        run: node scripts/moon.mjs run --target wasm-gc src/inference_demo
      - name: Run registered inference modules from a separate consumer
        working-directory: examples/inference-modules-v4
        run: moon run --target wasm-gc . --deny-warn
      - name: Restore checksum-pinned public test inputs
        run: python scripts/input_cache.py prepare --scope tests
      - name: Check publication privacy including history
        run: python scripts/publication_privacy.py --history
      - name: Verify committed business and presence capture byte bindings
        run: python scripts/verify_business_evidence.py --git
      - name: Install frozen optional compiler and driver for fixture tests
        # Fixed ORM compilation and protocol fixtures do not use a database.
        run: python -m pip install --require-hashes -r examples/orm-requirements.txt
      - name: Install checksum-pinned optional configured SQL parser
        run: python -m pip install --require-hashes -r integrations/python/requirements-configured-sql.txt
      - name: Verify configured parser CLI before core compilation
        run: |
          python -I -S -B -m unittest discover -s scripts -p test_configured_cross_cli.py -v
          python -B scripts/configured-sql-cross-inputs.py
      - name: Verify core, independent oracle, CLI and actual SQLite
        run: npm test
      - name: Verify configured point candidates and projection constructors
        env:
          MTW_SOURCE_V2_TEST_ROOT: ${{ runner.temp }}/mtw-source-v2-unit
          MTW_WINDOW_V2_TEST_ROOT: ${{ runner.temp }}/mtw-window-v2-unit
        run: |
          python -B -m unittest discover -s integrations/python/moontxnwitness_capture -p test_configured_sql_v2.py -t integrations/python -v
          python -B -m unittest discover -s integrations/python/moontxnwitness_capture -p test_configured_point_projection_v2.py -t integrations/python -v
          python -B -m unittest discover -s integrations/python -t integrations/python -p test_configured_source_v2.py -v
          python -B -m unittest discover -s integrations/python -t integrations/python -p test_configured_window_v2.py -v
          python -B -m unittest discover -s integrations/python -t integrations/python -p test_configured_factory_v2.py -v
          python -B scripts/configured-sql-v2-cross-inputs.py --output artifacts/point-v2/candidates.json
          python -B scripts/point-projection-v2-cross-inputs.py --output artifacts/point-v2/projections.json
          node scripts/moon.mjs build --target js --release src/sql_projection_v2_bridge --deny-warn
          node scripts/configured-sql-v2-cross-test.mjs --core _build/js/release/build/sql_projection_v2_bridge/sql_projection_v2_bridge.js --inputs artifacts/point-v2/candidates.json --output artifacts/point-v2/candidate-validation.json
          node scripts/point-projection-v2-cross-test.mjs --core _build/js/release/build/sql_projection_v2_bridge/sql_projection_v2_bridge.js --inputs artifacts/point-v2/projections.json --output artifacts/point-v2/projection-validation.json
      - name: Retain independent point projection checks and compiled core
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: point-projection-${{ matrix.os }}
          path: |
            artifacts/point-v2/
            _build/js/release/build/sql_projection_v2_bridge/
            dist/sql-projection-v2-core.mjs
            dist/structured-window-verification-core.mjs
            dist/build-manifest.json
          if-no-files-found: warn
          compression-level: 6
      - name: Verify declared source profiles and canonical model results
        run: node scripts/feature-matrix-v4.mjs --output artifacts/feature-matrix-v4
      - name: Compare original relation programs with the independent interpreter
        id: relation_reference
        if: runner.os == 'Linux'
        run: node scripts/relation-models-compare.mjs dist artifacts/relation-model-comparison
      - name: Verify fourteen relation definitions and source-policy boundaries
        if: runner.os == 'Linux'
        run: node scripts/relation-model-matrix-v4.mjs dist artifacts/relation-model-matrix
      - name: Preserve each selected model when reducing noisy counterexamples
        if: runner.os == 'Linux'
        run: node scripts/relation-model-reduction-matrix-v4.mjs dist artifacts/relation-model-matrix/cases.json artifacts/relation-model-reduction-matrix
      - name: Retain relation reference inputs, compiled core and per-model results
        if: always() && runner.os == 'Linux' && (steps.relation_reference.outcome == 'success' || steps.relation_reference.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relation-model-reference-linux
          path: |
            artifacts/relation-model-comparison/
            artifacts/relation-model-matrix/
            artifacts/relation-model-reduction-matrix/
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: feature-matrix-${{ matrix.os }}
          path: artifacts/feature-matrix-v4/
          if-no-files-found: error
          compression-level: 6
      - name: Verify benchmark evidence under filesystem faults
        run: node scripts/performance-evidence-test.mjs
      - name: Execute Native core on Linux
        if: runner.os == 'Linux'
        run: |
          node scripts/moon.mjs test --target native --deny-warn
          node scripts/moon.mjs run --target native src/inference_demo --deny-warn
      - name: Import same-source successful PostgreSQL CI packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/import_postgres_ci_bundle.py
      - name: Verify fresh source and portable consumers
        run: npm run package
      - name: Verify new MoonBit model APIs from a separate source consumer
        run: >-
          python -c "import json,os,subprocess,sys; from pathlib import Path; subprocess.run([sys.executable,'-B','scripts/verify-model-library-consumer.py','--version',json.loads(Path('package.json').read_text())['version'],'--source',str(Path.cwd()),'--output',str(Path(os.environ['RUNNER_TEMP'])/'mtw-new-model-library-consumer')],check=True)"
      - name: Retain new library consumer and actual compiled cores
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: new-model-library-consumer-${{ matrix.os }}
          path: ${{ runner.temp }}/mtw-new-model-library-consumer/
          if-no-files-found: warn
          compression-level: 6
      - name: Validate actual integration compatibility receipt
        run: python scripts/release.py --check-compatibility-receipt
      - name: Stage current-run evidence and exact current-version downloads
        if: always()
        run: python scripts/stage_ci_evidence.py
      - name: Verify receipt-bound CI unit log retention controller
        if: always()
        run: python .github/test_stage_unit_logs.py
      - name: Retain direct receipt-bound current unit logs
        if: always()
        run: python .github/stage_unit_logs.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: artifacts/ci-evidence/
          if-no-files-found: error
          compression-level: 6
