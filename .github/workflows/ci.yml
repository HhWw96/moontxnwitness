name: Publish exact CI GitHub release assets
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without v
        required: true
        type: string
      source_sha:
        description: Exact full source commit tested by a successful PUSH ci.yml run
        required: true
        type: string
      ci_run_id:
        description: Successful exact-head PUSH CI run ID
        required: true
        type: string
      release_notes:
        description: Technical Markdown notes including MoonTxnWitness vVERSION heading
        required: true
        type: string
      publish:
        description: Explicitly create missing immutable tag/release/assets (false prepares a reviewable candidate)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  github-assets:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'HhWw96/moontxnwitness'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # This write token is available only to this explicitly dispatched job.
    # The controller still performs no mutation without the publish input.
    permissions:
      contents: write
      actions: read
    env:
      MTW_RELEASE_VERSION: ${{ inputs.version }}
      MTW_RELEASE_SOURCE: ${{ inputs.source_sha }}
      MTW_RELEASE_CI_RUN: ${{ inputs.ci_run_id }}
      MTW_RELEASE_NOTES: ${{ inputs.release_notes }}
      MTW_RELEASE_PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate explicit inputs without executing release artifacts
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', os.environ['MTW_RELEASE_VERSION'])
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['MTW_RELEASE_SOURCE'])
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['MTW_RELEASE_CI_RUN'])
          assert os.environ['MTW_RELEASE_PUBLISH'] in ('true','false')
          PY
      - name: Check out only the trusted controller at the workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/publish-github-ci-release.py
            /scripts/test_publish_github_ci_release.py
            /.github/workflows/publish-github-ci-release.yml
      - name: Test release controller boundaries
        run: python -B -m unittest discover -s scripts -p test_publish_github_ci_release.py -v
      - name: Validate CI packet and prepare or explicitly publish GitHub assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          notes = Path(os.environ['RUNNER_TEMP']) / 'release-notes.md'
          notes.write_text(os.environ['MTW_RELEASE_NOTES'], encoding='utf8')
          args = [sys.executable, '-B', 'scripts/publish-github-ci-release.py',
                  '--version', os.environ['MTW_RELEASE_VERSION'],
                  '--source-sha', os.environ['MTW_RELEASE_SOURCE'],
                  '--ci-run-id', os.environ['MTW_RELEASE_CI_RUN'],
                  '--notes', str(notes),
                  '--output', str(Path(os.environ['RUNNER_TEMP']) / 'github-release-candidate')]
          if os.environ['MTW_RELEASE_PUBLISH'] == 'true':
              args.append('--publish')
          subprocess.run(args, check=True)
          PY
      - name: Diagnose artifact index after failure without executing contents
        if: failure()
        run: |
          python - <<'PY'
          import collections, hashlib, json, os, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'github-release-candidate'
          evidence = root / 'evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          path = root / 'original-artifact.zip'
          limit = 8 * 1024 * 1024
          summary = {'format': 'moontxnwitness-artifact-index-diagnostic/v1', 'artifactCodeExecuted': False, 'memberReadLimitBytes': limit}
          try:
              if not path.is_file():
                  raise ValueError('No downloaded original-artifact.zip is available')
              summary['archiveBytes'] = path.stat().st_size
              hasher = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      hasher.update(chunk)
              summary['archiveSha256'] = hasher.hexdigest()
              with zipfile.ZipFile(path) as archive:
                  members = archive.infolist()
                  if len(members) > 100000:
                      raise ValueError('Too many ZIP central-directory entries')
                  counts = collections.Counter(item.filename for item in members if not item.is_dir())
                  summary['duplicateMembersFirst50'] = sorted(name for name, count in counts.items() if count != 1)[:50]
                  actual = set(counts)
                  def read(name):
                      if counts[name] != 1:
                          raise ValueError('Required member missing or duplicated: ' + name)
                      item = archive.getinfo(name)
                      if item.file_size > limit or item.flag_bits & 1:
                          raise ValueError('Oversized or encrypted diagnostic member: ' + name)
                      with archive.open(item) as stream:
                          data = stream.read(limit + 1)
                      if len(data) != item.file_size or len(data) > limit:
                          raise ValueError('Diagnostic member length differs: ' + name)
                      return data
                  def strict(data):
                      def pairs(items):
                          result = {}
                          for key, value in items:
                              if key in result:
                                  raise ValueError('Duplicate JSON key')
                              result[key] = value
                          return result
                      return json.loads(data.decode('utf8'), object_pairs_hook=pairs, parse_constant=lambda value: (_ for _ in ()).throw(ValueError('Nonfinite JSON')))
                  raw = read('current-run-index.json')
                  index = strict(raw)
                  expected = {row['file'] for row in index['files']}
                  unindexed = sorted(actual - expected - {'current-run-index.json'})
                  missing = sorted(expected - actual)
                  summary.update(actualFileCount=len(actual), indexedFileCount=len(expected), unindexedCount=len(unindexed), missingCount=len(missing), unindexedFirst50=unindexed[:50], missingFirst50=missing[:50], indexSelfExcludedFromDifference=True)
                  saved = {}
                  for name, output in [('current-run-index.json', 'current-run-index.json'), ('receipt-bound-unit-logs.json', 'receipt-bound-unit-logs.json'), ('dist/build-manifest.json', 'diagnostic-dist-build-manifest.json')]:
                      if name not in actual:
                          saved[name] = {'present': False}
                          continue
                      data = raw if name == 'current-run-index.json' else read(name)
                      with (evidence / output).open('xb') as stream:
                          stream.write(data)
                      value = strict(data)
                      saved[name] = {'present': True, 'file': output, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'topLevelKeys': sorted(value)[:50] if isinstance(value, dict) else None}
                  summary['savedDiagnosticMembers'] = saved
          except Exception as error:
              summary['diagnosticError'] = {'type': type(error).__name__, 'message': str(error)[:512]}
          with (evidence / 'artifact-index-diagnostic.json').open('x', encoding='utf8') as stream:
              json.dump(summary, stream, indent=2)
              stream.write('\n')
          print(json.dumps(summary))
          PY
      - name: Retain candidate assets and validation receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/github-release-candidate/release/
            ${{ runner.temp }}/github-release-candidate/evidence/
            ${{ runner.temp }}/github-release-candidate/candidate.json
            ${{ runner.temp }}/github-release-candidate/published.json
          if-no-files-found: warn
          compression-level: 0
