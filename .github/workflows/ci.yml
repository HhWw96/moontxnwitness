name: Verify MoonTxnWitness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      MOONBIT_INSTALL_VERSION: 0.10.16+b1a0e846e
      MTW_INPUT_CACHE: ${{ github.workspace }}/artifacts/input-cache
    steps:
      - name: Enable long paths for the Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check repository size and source boundaries
        run: python scripts/repository_hygiene.py
      - name: Test repository index protections
        run: python -B -m unittest discover -s scripts -p test_repository_hygiene.py -v
      - name: Test bounded receipt storage
        run: python -B -m unittest discover -s scripts -p test_evidence_json.py -v
      - name: Test exact-source PostgreSQL CI import boundaries
        run: python -B -m unittest discover -s scripts -p 'test_postgres_ci_*.py' -v
      - name: Test frozen input cache faults
        run: python -B -m unittest discover -s scripts -p test_input_cache.py -v
      - name: Check package and publication contracts before compilation
        run: python -B scripts/preflight_release.py
      - name: Install official MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install official MoonBit (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Validate active compiler version
        run: node scripts/toolchain-policy.mjs
      - name: Test compiler version boundaries
        run: node scripts/toolchain-policy-test.mjs
      - name: Run the MoonBit library example
        run: node scripts/moon.mjs run --target wasm-gc src/demo
      - name: Restore checksum-pinned public test inputs
        run: python scripts/input_cache.py prepare --scope tests
      - name: Check publication privacy including history
        run: python scripts/publication_privacy.py --history
      - name: Verify committed business and presence capture byte bindings
        run: python scripts/verify_business_evidence.py --git
      - name: Install frozen optional compiler and driver for fixture tests
        # Fixed ORM compilation and protocol fixtures do not use a database.
        run: python -m pip install --require-hashes -r examples/orm-requirements.txt
      - name: Verify core, independent oracle, CLI and actual SQLite
        run: npm test
      - name: Verify benchmark evidence under filesystem faults
        run: node scripts/performance-evidence-test.mjs
      - name: Execute Native core on Linux
        if: runner.os == 'Linux'
        run: node scripts/moon.mjs test --target native --deny-warn
      - name: Import same-source successful PostgreSQL CI packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/import_postgres_ci_bundle.py
      - name: Verify fresh source and portable consumers
        run: npm run package
      - name: Validate actual integration compatibility receipt
        run: python scripts/release.py --check-compatibility-receipt
      - name: Stage current-run evidence and exact current-version downloads
        if: always()
        run: python scripts/stage_ci_evidence.py
      - name: Verify receipt-bound CI unit log retention controller
        if: always()
        run: python .github/test_stage_unit_logs.py
      - name: Retain direct receipt-bound current unit logs
        if: always()
        run: python .github/stage_unit_logs.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: artifacts/ci-evidence/
          if-no-files-found: error
          compression-level: 6
