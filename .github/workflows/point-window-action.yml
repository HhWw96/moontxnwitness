name: Verify the public point-window Action
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  action:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            fixture: ordered
            code: '0'
          - os: windows-2022
            fixture: before
            code: '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test download, extraction and result boundaries
        run: python -B -m unittest discover -s scripts -p test_point_window_action.py
      - name: Stage the capsule with its fixture digest
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          python -B - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path

          data = Path('examples/point-window-replay-data')
          name = os.environ['FIXTURE'] + '.json.gz'
          encoded = (data / name).read_bytes()
          expected = json.loads((data / 'manifest.json').read_bytes())['sha256'][name]
          assert hashlib.sha256(encoded).hexdigest() == expected
          Path('point-window-input.json').write_bytes(gzip.decompress(encoded))
          PY
      - name: Run the Action with the public portable archive
        id: public
        continue-on-error: true
        uses: ./.github/actions/check-point-window
        with:
          release-version: '0.6.4'
          portable-sha256: 53483a92b1449667914456a7999ce28ad3406e1389467b86661d736e7e7bfdfc
          capsule: point-window-input.json
          config: examples/point-window-replay-data/config.json
          policy: examples/point-window-replay-data/policy.json
      - name: Assert the expected gate outcome
        shell: bash
        env:
          EXPECTED_CODE: ${{ matrix.code }}
          ACTUAL_CODE: ${{ steps.public.outputs.exit-code }}
          VERDICT: ${{ steps.public.outputs.verdict }}
          OUTCOME: ${{ steps.public.outcome }}
        run: |
          python -B - <<'PY'
          import json
          import os

          code = os.environ['EXPECTED_CODE']
          assert os.environ['ACTUAL_CODE'] == code, os.environ['VERDICT']
          assert os.environ['OUTCOME'] == ('success' if code == '0' else 'failure')
          verdict = json.loads(os.environ['VERDICT'])
          assert verdict['sourceCoverageComplete'] is True
          assert verdict['accepted'] is (code == '0')
          assert verdict['verifiedRefutation'] is (code == '1')
          PY
