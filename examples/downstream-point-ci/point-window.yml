name: Verify a PostgreSQL point window
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Recompute the captured window
        uses: HhWw96/moontxnwitness/.github/actions/check-point-window@8326e22b766617682709b29d5ef12de6aecebb88
        with:
          release-version: '0.6.4'
          portable-sha256: 53483a92b1449667914456a7999ce28ad3406e1389467b86661d736e7e7bfdfc
          capsule: ci/point-window.capsule.json
          config: ci/point-window-config.json
          policy: ci/point-window-policy.json
          max-point-checks: '1000000'
